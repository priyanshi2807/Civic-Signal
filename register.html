{% extends "base.html" %}{% block content %}<section class="auth"><form id="registerForm" class="card"><h1>Create citizen account</h1><label>Full name<input name="full_name" required></label><label>Email<input name="email" type="email" required></label><label>Password (10+ characters)<input name="password" type="password" minlength="10" required></label><p id="message"></p><button class="btn">Create account</button><p>Already registered? <a href="/login">Sign in</a></p></form></section>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});let j=await r.json();document.getElementById('message').textContent=j.message||j.error;if(r.ok)setTimeout(()=>location.href='/login',900)};</script>{% endblock %}
