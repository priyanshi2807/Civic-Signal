{% extends "base.html" %}{% block content %}<section class="auth"><form id="loginForm" class="card"><h1>Sign in</h1><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><p id="message"></p><button class="btn">Sign in</button><p>New here? <a href="/register">Create an account</a></p></form></section>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();let f=e.target;let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});let j=await r.json();if(r.ok)location.href='/dashboard';else document.getElementById('message').textContent=j.error||'Login failed'};</script>{% endblock %}
